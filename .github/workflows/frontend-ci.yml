name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # フリート同形（payout ほか）: 全チェックを npm run check 経由で回す。
      # check = type-check → lint（ESLint ゲート・#178）→ lint:ratchet（#182）
      #         → test（ツールチェーン健全性ガードを含む・#208）
      #         → audit（依存脆弱性ゲート audit-ci・#208）→ build。
      - name: Run checks
        working-directory: frontend
        run: npm run check

      # 生成物ドリフト検知ゲート（#163）。直前の `npm run check` 末尾が build なので、
      # ここでの public_html/ は「クリーンビルドの出力」になっている。それがコミット済みの
      # 内容と一致するか（#185 の再発防止）と、2つのビルドが互いの成果物を壊していないかを見る。
      #
      # 🔴 なぜ `npm run check` の中に入れないか: check はローカルでも回すもので、
      # ソースを編集して再ビルドした直後は生成物が「未コミット」なのが正常な状態になる。
      # そこで赤くすると check が日常的に落ち、開発者が check を回さなくなる。
      # 一方 CI はコミット済みの状態を checkout しているので、ここでの差分は本物のドリフトだけ。
      # フリート配布原則の「ゲートは npm run check に集約」は *別ジョブを増やすと required の
      # 追加依頼が要る* ことが理由なので、**既存ジョブへのステップ追加**でその意図は満たしている。
      - name: Check generated artifact drift
        working-directory: frontend
        run: npm run check:artifacts
